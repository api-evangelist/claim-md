description: >-
  FinOps view of Claim.MD spend. Claim.MD is a medical-claims clearinghouse
  billed per provider via sales-led agreements rather than transparent public
  usage rates, so unit costs are not published. The natural cost and usage
  dimensions for tracking are claims submitted, ERA processed, and eligibility
  checks performed, allocated by billing provider / NPI and payer.
notes: >-
  Per-provider rates are negotiated and not public; confirm contract terms with
  Claim.MD and instrument usage counts (claims, ERA, eligibility) for internal
  allocation. Meters below describe usage to track, not published prices.
sources:
- https://www.claim.md/services-providers
- https://www.claim.md/services-software-vendors
