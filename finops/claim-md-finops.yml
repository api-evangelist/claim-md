meters:
- name: claims_submitted
  description: Claims submitted through the clearinghouse (837P/837I and other formats).
  unit: claims
  aggregation: sum
  dimensions:
  - account
  - provider
  - payer
- name: era_processed
  description: Electronic remittance advice (835) retrieved and processed.
  unit: era
  aggregation: sum
  dimensions:
  - account
  - provider
  - payer
- name: eligibility_checks
  description: Real-time eligibility (270/271) requests performed.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - provider
  - payer
- name: enrollments
  description: Provider enrollment requests initiated through the API.
  unit: enrollments
  aggregation: sum
  dimensions:
  - account
  - provider
  - payer
principles:
- name: Visibility
  description: Track claim, ERA, and eligibility counts per provider and payer against invoices.
- name: Allocation
  description: Map AccountKey usage and billing-provider/NPI to internal cost centers.
- name: Optimization
  description: Batch up to 2000 claims per upload and use incremental polling to minimize redundant API calls.
- name: Accountability
  description: Assign owners per provider account; review monthly clearinghouse spend against claim volume.
maintainers:
