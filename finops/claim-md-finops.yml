serviceCategory: Healthcare Clearinghouse
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Claim.MD Clearinghouse
  ServiceCategory: Healthcare Clearinghouse
  ProviderName: Claim.MD
  PublisherName: Claim.MD
  InvoiceIssuerName: Claim.MD
