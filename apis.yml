name: Claim.MD
kind: company
description: Claim.MD is a medical-claims clearinghouse that connects healthcare providers
  and software vendors to thousands of payers. Its REST API (authenticated with an
  AccountKey) supports electronic claim submission (837P/837I), claim status tracking,
  electronic remittance advice (835 ERA), real-time eligibility (270/271), and file
  upload/download workflows.
