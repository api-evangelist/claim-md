# Claim.MD integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in claim-md-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: claim-md-directtrust-accreditation-health-it
  label: DirectTrust Accreditation (health IT)
  partner_name: DirectTrust Accreditation (health IT)
  category: Health IT accreditation (Direct exchange, health networks, privacy & security)
  type: register
  channel: standard-directory
  evidence: https://accreditation.directtrust.org/accredited-organization-detail/?accountID=6674830000003340201
  source: edge
  relationship: standard-participant
  contract_reference:
    register: DirectTrust Accredited Organizations (accreditation.directtrust.org; EHNAC merged into DirectTrust)
    spec_file: null
    standard: DirectTrust / EHNAC health IT accreditation
    role: accredited
    registered_name: Claim.MD, Inc.
    register_id: '6674830000003340201'
    website: http://www.claim.md
    matched_domain: claim.md
    matched_by: domain
    identity_source: the website the organization filed on its DirectTrust detail page (no lookup)
    programs:
    - program: Healthcare Network-EHN
      status: Accreditation
      expiry: '2027-08-31'
    - program: HITRUST
      status: Certification
      expiry: '2027-10-31'
    certified_products:
    - product: DirectTrust Healthcare Network-EHN
      program: Healthcare Network-EHN
      lapsed: false
      expiry: '2027-08-31'
    - product: DirectTrust HITRUST
      program: HITRUST
      lapsed: false
      expiry: '2027-10-31'
    market_fit: own apis.yml tags carry a health IT term
    signal_note: certified_products = one entry per granted DirectTrust PROGRAM (accreditation type); Candidate
      / Provisional = participation only; lapsed when the expiry month has passed; e-Rx programs (EPCS, ePrescribing-EHN)
      are counted by e-prescribing, never here
    detected_by: sweep-certified-health-it.py
    detected: '2026-10-20'
  status: not-a-workflow
  arazzo: null
